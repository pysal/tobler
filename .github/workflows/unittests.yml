---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "59 23 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Manual CI Run
        default: test
        required: false

jobs:
  tests:
    name: ${{ matrix.os }}, ${{ matrix.environment-file }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
        environment-file:
          [
            ci/312-oldest.yml,
            ci/312-latest.yml,
            ci/313-latest.yml,
            ci/314-latest.yml,
            ci/314-dev.yml,
          ]
        include:
          - environment-file: ci/314-latest.yml
            os: macos-latest # Apple Silicon
          - environment-file: ci/314-latest.yml
            os: windows-latest
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ${{ matrix.environment-file }}
          micromamba-version: "latest"

      - name: environment info
        run: |
          micromamba info
          micromamba list

      - name: spatial versions
        run: "python -c 'import geopandas; geopandas.show_versions();'"

      - name: install package
        run: "pip install -e . --no-deps"

      - name: Download test files
        run: |
          python -c "
          import libpysal

          libpysal.examples.fetch_all()
          "

      - name: run tests
        run: |
          pytest tobler \
          -v \
          -r a \
          -n auto \
          --color yes \
          --cov tobler \
          --cov-append \
          --cov-report term-missing \
          --cov-report xml .

      - name: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
