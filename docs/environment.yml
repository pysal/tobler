name: doc
channels:
  - conda-forge
dependencies:
  - python=3.14
  - astropy
  - dask
  - dask-geopandas
  - geopandas>=1
  - h3-py
  - joblib
  - jupyterlab
  - libpysal
  - numpy
  - pandas
  - pointpats
  - rasterio
  - rasterstats
  - scikit-learn
  - scipy
  - statsmodels
  - tqdm

  # docs deps
  # - cenpy # see below; uncomment we new version on CenPy is available via conda-forge
  - contextily
  - geodatasets
  - lonboard
  - osmnx
  - watermark

  # docs themselves
  - nbsphinx
  - numpydoc
  - myst-nb
  - myst-parser
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-autodoc2
  - sphinx-autosummary-accessors
  - sphinx-copybutton
  - sphinx-immaterial

  - pip:
    # [2026-11] need master branch of `cenpy`
    - git+https://github.com/cenpy-dev/cenpy@master