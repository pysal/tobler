name: doc
channels:
  - conda-forge
dependencies:
  - python=3.14
  - astropy
  - dask
  - dask-geopandas
  - geopandas>=1
  - h3-py
  - joblib
  - jupyterlab
  - libpysal
  - numpy
  - pandas
  - pointpats
  - rasterio
  - rasterstats
  - scikit-learn
  - scipy
  - statsmodels
  - tqdm

  # docs deps
  - cenpy
  - contextily
  - geodatasets
  - lonboard
  - osmnx
  - watermark

  # docs themselves
  - nbsphinx
  - numpydoc
  - myst-nb
  - myst-parser
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-autodoc2
  - sphinx-autosummary-accessors
  - sphinx-copybutton
  - sphinx-immaterial